    }

    var v = expression();
    if (k < j.length) throw new Error("syntaxe");
    if (isNaN(v)) throw new Error("domaine");
    if (!isFinite(v)) throw new Error("infini");
    return Number(v.toPrecision(12));
  }
  var MESSAGES = {
    syntaxe: "Erreur de syntaxe", vide: "Rien à calculer", division: "Division par zéro",
    domaine: "Hors du domaine de définition", infini: "Résultat trop grand"
  };

  /* ─────────── le pave ─────────── */
  var EFFACER = "⌫", TOUT = "AC", EGAL = "=";
  var TOUCHES = [
    ["sin⁻¹", "sin⁻¹(", "fonction"], ["cos⁻¹", "cos⁻¹(", "fonction"], ["tan⁻¹", "tan⁻¹(", "fonction"], ["π", "π", "fonction"], ["e", "e", "fonction"],
    ["sin", "sin(", "fonction"], ["cos", "cos(", "fonction"], ["tan", "tan(", "fonction"], ["ln", "ln(", "fonction"], ["log", "log(", "fonction"],
    ["√", "√(", "op"], ["x²", "²", "op"], ["xʸ", "^", "op"], ["(", "(", "op"], [")", ")", "op"],
    ["7", "7", "chiffre"], ["8", "8", "chiffre"], ["9", "9", "chiffre"], [EFFACER, EFFACER, "efface"], [TOUT, TOUT, "efface"],
    ["4", "4", "chiffre"], ["5", "5", "chiffre"], ["6", "6", "chiffre"], ["×", "×", "op"], ["÷", "÷", "op"],
    ["1", "1", "chiffre"], ["2", "2", "chiffre"], ["3", "3", "chiffre"], ["+", "+", "op"], ["−", "−", "op"],
    ["0", "0", "chiffre"], [",", ",", "chiffre"], ["×10ⁿ", "×10^", "op"], ["Ans", "Ans", "fonction"], [EGAL, EGAL, "egal"]
  ];
  /* Ce que ⌫ efface d'un coup, plutot que lettre par lettre */
  var BLOCS = ["sin⁻¹(", "cos⁻¹(", "tan⁻¹(", "sin(", "cos(", "tan(", "ln(", "log(", "√(", "×10^", "Ans"];
  /* Apres un resultat, ces touches partent de Ans, comme sur une calculatrice */
  var APRES_ANS = ["+", "−", "×", "÷", "^", "²", "×10^"];

  function el(tag, attrs, enfants) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "classe") n.className = attrs[k];
      else if (k === "texte") n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (enfants || []).forEach(function (e) { if (e) n.appendChild(e); });
    return n;
  }
  function joli(texte) {
    return texte.replace(/\*/g, "×").replace(/\//g, "÷").replace(/-/g, "−").replace(/\./g, ",");
  }
  /* Ce qu'on recopie dans la saisie : la valeur, ecrite comme on la taperait */
  function brut(x) {
    return String(Number(x.toPrecision(10))).replace("e+", "E").replace("e-", "E−").replace(".", ",");
  }

  function monter(conteneur) {
    var degres = true, ans = 0, aUnResultat = false;
    var tactile = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    var bDeg = el("button", { type: "button", "aria-pressed": "true", texte: "Degrés" });
    var bRad = el("button", { type: "button", "aria-pressed": "false", texte: "Radians" });
    var historique = el("ol", { classe: "calc-historique" });
    var ecran = el("div", { classe: "calc-ecran", "aria-live": "polite" }, [historique]);
    var saisie = el("input", { type: "text", classe: "calc-saisie", autocomplete: "off", spellcheck: "false",
      "aria-label": "Calcul à effectuer", placeholder: "2,5×10^3 ÷ (1163×20)" });
    if (tactile) saisie.setAttribute("inputmode", "none");   /* le pave suffit, pas de clavier par-dessus */
    var pave = el("div", { classe: "calc-touches" });

    function angle(deg) {
      degres = deg;
      bDeg.setAttribute("aria-pressed", deg ? "true" : "false");
      bRad.setAttribute("aria-pressed", deg ? "false" : "true");
    }
    bDeg.addEventListener("click", function () { angle(true); });
    bRad.addEventListener("click", function () { angle(false); });

    function inserer(txt) {
      var a = saisie.selectionStart === null ? saisie.value.length : saisie.selectionStart;
      var b = saisie.selectionEnd === null ? a : saisie.selectionEnd;
      if (saisie.value === "" && aUnResultat && APRES_ANS.indexOf(txt) >= 0) { txt = "Ans" + txt; }
      saisie.value = saisie.value.slice(0, a) + txt + saisie.value.slice(b);
      var p = a + txt.length;
      saisie.setSelectionRange(p, p);
    }
    function effacer() {
      var a = saisie.selectionStart, b = saisie.selectionEnd, v = saisie.value;
      if (a !== b) { saisie.value = v.slice(0, a) + v.slice(b); saisie.setSelectionRange(a, a); return; }
      if (a === 0) return;
      var avant = v.slice(0, a), n = 1;
      for (var i = 0; i < BLOCS.length; i++) if (avant.slice(-BLOCS[i].length) === BLOCS[i]) { n = BLOCS[i].length; break; }
      saisie.value = v.slice(0, a - n) + v.slice(a);
      saisie.setSelectionRange(a - n, a - n);
    }
    function ligne(expr, contenu, erreur) {
      var bExpr = el("button", { type: "button", classe: "calc-expr", title: "Reprendre ce calcul", texte: joli(expr) });
      bExpr.addEventListener("click", function () { saisie.value = expr; saisie.focus(); });
      var bRes = el("button", { type: "button", classe: "calc-res" + (erreur ? " erreur" : ""), texte: contenu });
      if (!erreur) {
        var valeur = ans;
        bRes.title = "Insérer cette valeur";
        bRes.addEventListener("click", function () { inserer(brut(valeur)); saisie.focus(); });
      }
      historique.appendChild(el("li", {}, [bExpr, bRes]));
      while (historique.children.length > 40) historique.removeChild(historique.firstChild);
      ecran.scrollTop = ecran.scrollHeight;
    }
    function calculer() {
      var expr = saisie.value.trim();
      if (!expr) return;
      var ouvertes = (expr.match(/\(/g) || []).length - (expr.match(/\)/g) || []).length;
      for (; ouvertes > 0; ouvertes--) expr += ")";   /* l'historique montre ce qui a ete calcule */
      try {
        ans = evaluer(expr, degres, ans);
        aUnResultat = true;
        ligne(expr, N.ecrire(ans, 10), false);
        saisie.value = "";
      } catch (err) {
        ligne(expr, MESSAGES[err.message] || MESSAGES.syntaxe, true);
      }
    }

    TOUCHES.forEach(function (t) {
      var b = el("button", { type: "button", classe: t[2], tabindex: "-1", texte: t[0] });
      if (t[0] === EFFACER) b.setAttribute("aria-label", "Effacer");
      if (t[0] === TOUT) b.setAttribute("aria-label", "Tout effacer");
      /* garder le curseur dans la saisie : la touche ne prend pas le focus */
      b.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
      b.addEventListener("click", function () {
        if (t[1] === EGAL) calculer();
        else if (t[1] === EFFACER) effacer();
        else if (t[1] === TOUT) saisie.value = "";
        else inserer(t[1]);
        if (!tactile) saisie.focus();
      });
      pave.appendChild(b);
    });
    saisie.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); calculer(); }
      else if (ev.key === "Escape") { saisie.value = ""; }
    });

    conteneur.appendChild(el("div", { classe: "calc-angle", role: "group", "aria-label": "Unité d'angle" }, [bDeg, bRad]));
    conteneur.appendChild(ecran);
    conteneur.appendChild(saisie);
    conteneur.appendChild(pave);
    return { focus: function () { if (!tactile) saisie.focus(); } };
  }

  return { monter: monter, evaluer: evaluer };
})();

</script>
<script>/* moteur/jeu.js */
/* Entrainement · le moteur.

   Deux modes, une seule facon de poser une question :
   - le CONTRE-LA-MONTRE des automatismes : des questions fabriquees au hasard, un
     chrono, trois coeurs, une serie qui multiplie les points, un niveau qui monte
     tous les cinq bons coups, et l'installation de la classe qui se remet en service
     organe par organe ;
   - le PARCOURS d'une lecon : des etapes dans l'ordre, chacune a reussir pour ouvrir
     la suivante, notee d'une a trois etoiles.

   Le contenu vient des fichiers de contenu/, qui appellent Entrainement.classe({...}).
   Rien ne sort de l'appareil : records et etoiles vivent dans le localStorage, sous
   try/catch, et la page fonctionne sans. */
"use strict";
var Entrainement = (function () {
  var N = Nombres, G = Generateurs;
  var CLASSES = [], PROBLEMES = [];
  var racine = null, annonces = null;
  var arretEnCours = null;   /* coupe le chrono de la partie en cours */
  var clavier = null;        /* raccourcis de la question affichee */

  /* ═══════════════════════════════════════════ STOCKAGE : l'appareil, pas l'eleve */
  var CLE = "entrainement";
  var etat = (function () {
    var e = {};
    try { e = JSON.parse(localStorage.getItem(CLE)) || {}; } catch (err) { e = {}; }
    e.records = e.records || {}; e.parcours = e.parcours || {}; e.reglages = e.reglages || {};
    return e;
  })();
  function sauver() { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (err) { /* navigation privee */ } }

  /* ═══════════════════════════════════════════ LE CONTENU ET SON CONTROLE */
  function classe(def) {
    PROBLEMES = PROBLEMES.concat(controler(def));
    CLASSES.push(def);
  }
  /* Un fichier de contenu peut completer une classe deja declaree : au BTS, la
     thermique et l'hydraulique vivent chacune dans leur fichier. */
  function completer(id, ajout) {
    var c = trouver(CLASSES, id);
    if (!c) { PROBLEMES.push(id + " : classe à compléter introuvable ; son fichier doit être chargé avant."); return; }
    PROBLEMES = PROBLEMES.concat(controler({ id: id, nom: c.nom, automatismes: ajout.automatismes, lecons: ajout.lecons }));
    c.automatismes = (c.automatismes || []).concat(ajout.automatismes || []);
    c.lecons = (c.lecons || []).concat(ajout.lecons || []);
  }
  function controlerQuestion(q, lieu, p) {
    if (q.type === "choix") {
      var justes = (q.choix || []).filter(function (c) { return c.juste; }).length;
      if (justes !== 1) p.push(lieu + " : il faut exactement une réponse juste (" + justes + ").");
      (q.choix || []).forEach(function (c) {
        if (!c.juste && !c.erreur) p.push(lieu + " : la proposition « " + c.texte + " » ne nomme pas son erreur.");
      });
    } else if (q.type === "nombre") {
      if (typeof q.reponse !== "number") p.push(lieu + " : la réponse n'est pas un nombre.");
      if (!q.unite) p.push(lieu + " : l'unité manque.");
    } else p.push(lieu + " : type inconnu (choix, nombre, ou un générateur).");
  }
  function controlerGenerateur(g, lieu, p) {
    if (!g || !G.existe(g.nom)) { p.push(lieu + " : générateur inconnu « " + (g && g.nom) + " »."); return; }
    if (g.nom === "banque") {
      if (!g.questions || !g.questions.length) p.push(lieu + " : banque vide.");
      (g.questions || []).forEach(function (q, k) { controlerQuestion(q, lieu + ", banque n° " + (k + 1), p); });
    }
  }
  function controler(def) {
    var p = [], ou = def.id || "(classe sans id)";
    if (!def.id || !def.nom) p.push(ou + " : il faut un id et un nom.");
    (def.automatismes || []).forEach(function (a) {
      var lieu = ou + " / " + (a.id || "?");
      if (!a.id || !a.titre) p.push(lieu + " : un automatisme sans id ou sans titre.");
      if (!a.generateurs || !a.generateurs.length) p.push(lieu + " : aucun générateur.");
      (a.generateurs || []).forEach(function (g) { controlerGenerateur(g, lieu, p); });
    });
    (def.lecons || []).forEach(function (l) {
      if (!l.etapes || !l.etapes.length) p.push(ou + " / " + l.id + " : aucune étape.");
      (l.etapes || []).forEach(function (e, i) {
        (e.questions || []).forEach(function (q, j) {
          var lieu = ou + " / " + l.id + ", étape " + (i + 1) + ", question " + (j + 1);
          if (q.generateur) controlerGenerateur(q.generateur, lieu, p);
          else controlerQuestion(q, lieu, p);
        });
      });
    });
    return p;
  }
  function trouver(liste, id) {
    for (var i = 0; i < (liste || []).length; i++) if (liste[i].id === id) return liste[i];
    return null;
  }

  /* ═══════════════════════════════════════════ LE DOM */
  function h(tag, attrs, enfants) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "classe") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else if (k === "texte") n.textContent = v;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    (function ajouter(e) {   /* les listes imbriquees sont aplaties */
      if (e === null || e === undefined || e === false) return;
      if (Array.isArray(e)) { e.forEach(ajouter); return; }
      n.appendChild(typeof e === "string" ? document.createTextNode(e) : e);
    })(enfants);
    return n;
  }
  function vider(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function afficher(noeuds) {
    clavier = null;
    vider(racine);
    [].concat(noeuds).forEach(function (n) { if (n) racine.appendChild(n); });
    window.scrollTo(0, 0);
  }
  function relancer(n, classeAnim) { n.classList.remove(classeAnim); void n.offsetWidth; n.classList.add(classeAnim); }

  var COEUR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2l-1.4-1.3C5.4 15.3 2 12.2 2 8.4 2 5.4 4.4 3 7.4 3c1.7 0 3.4.8 4.6 2.1C13.1 3.8 14.8 3 16.6 3 19.6 3 22 5.4 22 8.4c0 3.8-3.4 6.9-8.6 11.5L12 21.2z"/></svg>';
  var ETOILE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.3l-5.9 3.2 1.3-6.5-4.9-4.6 6.6-.8z"/></svg>';
  function coeurs(n, max, casse) {
    var d = h("span", { classe: "vies", role: "img", "aria-label": n + " cœur" + (n > 1 ? "s" : "") + " sur " + max });
    for (var i = 0; i < max; i++)
      d.appendChild(h("span", { classe: "coeur" + (i < n ? "" : " perdu") + (i === casse ? " casse" : ""), html: COEUR }));
    return d;
  }
  function etoiles(n) {
    var d = h("span", { classe: "etoiles", role: "img", "aria-label": n + " étoile" + (n > 1 ? "s" : "") + " sur 3" });
    for (var i = 0; i < 3; i++) d.appendChild(h("span", { classe: "etoile" + (i < n ? "" : " vide"), html: ETOILE }));
    return d;
  }
  function annoncer(texte) {
    var t = h("div", { classe: "annonce", texte: texte });
    annonces.appendChild(t);
    setTimeout(function () { t.classList.add("part"); }, 1700);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
  }

  /* ═══════════════════════════════════════════ LE SON : coupe par defaut, une salle de classe */
  var Son = (function () {
    var ctx = null;
    function notes(freqs, duree, forme) {
      if (!etat.reglages.son) return;
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        var t0 = ctx.currentTime;
        freqs.forEach(function (f, i) {
          var o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + i * duree;
          o.type = forme || "sine"; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
          o.connect(g); g.connect(ctx.destination);
          o.start(t); o.stop(t + duree + 0.02);
        });
      } catch (err) { /* pas d'audio : tant pis */ }
    }
    return {
      juste: function () { notes([660, 880], 0.08); },
      faux: function () { notes([220, 165], 0.13, "triangle"); },
      niveau: function () { notes([523, 659, 784, 1047], 0.07); },
      fin: function () { notes([784, 659, 523], 0.12); }
    };
  })();

  /* ═══════════════════════════════════════════ LA CALCULATRICE
     Pour les classes qui ont `calculatrice: true` : un bouton dans la barre des parties
     et des etapes ouvre la calculatrice du depot (moteur/calculette.js) dans un panneau,
     a droite de la question, par-dessus sur telephone. Le panneau est garde d'une
     question a l'autre : l'historique et Ans restent. L'emulateur NumWorks a ete essaye
     puis ecarte le 6 octobre 2026 : ses CGU en interdisent la diffusion. */
  var Calculatrice = (function () {
    var panneau = null, calc = null, ouverte = false, boutons = [];
    function construire() {
      var fermer = h("button", { type: "button", classe: "bouton-son" }, "Fermer");
      fermer.addEventListener("click", function () { montrer(false); });
      var corps = h("div", { classe: "calc-corps" });
      panneau = h("aside", { classe: "calculatrice", "aria-label": "Calculatrice", hidden: true }, [
        h("div", { classe: "calc-tete" }, [h("span", { classe: "hud-nom", texte: "Calculatrice" }), fermer]),
        corps
      ]);
      document.body.appendChild(panneau);
      calc = Calculette.monter(corps);
    }
    function montrer(oui) {
      if (oui && !panneau) construire();
      if (!panneau) return;
      ouverte = oui;
      panneau.hidden = !oui;
      document.body.classList.toggle("calc-ouverte", oui);
      boutons.forEach(function (b) { b.setAttribute("aria-pressed", oui ? "true" : "false"); });
      if (oui) setTimeout(calc.focus, 40);
    }
    function bouton() {
      var b = h("button", { type: "button", classe: "bouton-son bouton-calc", "aria-pressed": ouverte ? "true" : "false" }, "Calculatrice");
      b.addEventListener("click", function () { montrer(!ouverte); });
      boutons = [b];
      return b;
    }
    return { bouton: bouton, fermer: function () { montrer(false); } };
  })();

  /* ═══════════════════════════════════════════ LES PIECES COMMUNES DES ECRANS */
  function barre(retour, calculatrice) {
    function libelle() { return etat.reglages.son ? "Son : activé" : "Son : coupé"; }
    var bouton = h("button", { type: "button", classe: "bouton-son", "aria-pressed": etat.reglages.son ? "true" : "false" }, libelle());
    bouton.addEventListener("click", function () {
      etat.reglages.son = !etat.reglages.son; sauver();
      bouton.setAttribute("aria-pressed", etat.reglages.son ? "true" : "false");
      bouton.textContent = libelle();
      Son.juste();
    });
    if (!calculatrice) Calculatrice.fermer();
    return h("div", { classe: "barre" }, [
      retour ? h("a", { classe: "lien-retour", href: retour.href }, "← " + retour.texte) : h("span"),
      h("div", { classe: "rangee" }, [calculatrice ? Calculatrice.bouton() : null, bouton])
    ]);
  }
  function entete(surtitre, titre, chapeau) {
    return h("header", { classe: "entete" }, [
      surtitre ? h("p", { classe: "surtitre", texte: surtitre }) : null,
      h("h1", { texte: titre }),
      chapeau ? h("p", { classe: "chapeau", html: chapeau }) : null
    ]);
  }
  function pied() {
    return h("footer", { classe: "pied" },
      "Rien n'est envoyé : records et étoiles restent dans ce navigateur, sur cet appareil.");
  }
  function pluriel(n, mot) { return n + " " + mot + (n > 1 ? "s" : ""); }

  /* ═══════════════════════════════════════════ ACCUEIL : les classes */
  function accueil() {
    document.title = "Entraînement";
    var derniere = etat.reglages.classe;
    var boite = PROBLEMES.length ? h("div", { classe: "problemes", role: "alert" }, [
      h("p", { html: "<b>Contenu à revoir</b> — " + pluriel(PROBLEMES.length, "point") + " :" }),
      h("ul", {}, PROBLEMES.map(function (p) { return h("li", { texte: p }); }))
    ]) : null;
    afficher([
      barre(null),
      entete("Entraînement", "Automatismes et leçons",
        "Des calculs rapides contre la montre, et les leçons du cours reprises pas à pas. Choisissez votre classe."),
      boite,
      h("div", { classe: "grille" }, CLASSES.map(function (c) {
        var nA = (c.automatismes || []).length, nL = (c.lecons || []).length;
        return h("a", { classe: "carte carte-lien", href: "#/" + c.id }, [
          h("span", { classe: "surtitre" }, [c.niveau || "", c.id === derniere ? h("span", { classe: "pastille accent", texte: "dernière ouverte" }) : null]),
          h("span", { classe: "titre-carte", texte: c.nom }),
          h("span", { classe: "detail", texte: [nA ? pluriel(nA, "automatisme") : "", nL ? pluriel(nL, "leçon") : ""].filter(Boolean).join(" · ") })
        ]);
      })),
      pied()
    ]);
  }

  /* ═══════════════════════════════════════════ UNE CLASSE : automatismes et lecons */
  /* Range une liste par theme : l'ordre de c.themes d'abord, puis l'ordre d'apparition. */
  function parTheme(c, liste) {
    var ordre = (c.themes || []).slice(), groupes = {};
    liste.forEach(function (x) {
      var t = x.theme || "";
      if (ordre.indexOf(t) < 0) ordre.push(t);
      (groupes[t] = groupes[t] || []).push(x);
    });
    return ordre.filter(function (t) { return groupes[t]; }).map(function (t) { return [t, groupes[t]]; });
  }
  function grilleParTheme(c, liste, carte) {
    var groupes = parTheme(c, liste), sortie = [];
    groupes.forEach(function (g) {
      if (g[0]) sortie.push(h("h3", { classe: "groupe", texte: g[0] }));
      sortie.push(h("div", { classe: "grille" }, g[1].map(carte)));
    });
    return sortie;
  }
  function pageClasse(c) {
    document.title = c.nom + " · Entraînement";

  /* ═══════════════════════════════════════════ POSER UNE QUESTION
     Commun aux deux modes. `mode` vaut "choix" ou "libre". `fin(res, zoneRetour)`
     est appele une seule fois, avec res = { juste, erreur }. */
  /* L'ecriture d'une valeur proposee ou attendue. En decimal plein (CAP, seconde) :
     exacte si elle tombe juste en six decimales, arrondie au millieme sinon. */
  function ecrireValeur(q, x) {
    if (!q.decimale) return N.ecrire(x, 4);
    if (q.arrondi !== undefined) x = Number(x.toFixed(q.arrondi));
    else if (Math.abs(x - Number(x.toFixed(6))) > 1e-9) x = Number(x.toFixed(3));
    return N.ecrireDecimal(x);
  }
  function propositions(q) {
    if (q.type === "choix") return G.melanger(q.choix.map(function (c) {
      return { texte: c.texte, juste: !!c.juste, erreur: c.juste ? null : { nom: c.erreur, explication: c.explication || "" } };
    }));
    var ecrire = function (x) { return ecrireValeur(q, x); };
    var u = q.unite ? " " + q.unite : "";
    var faux = G.melanger(q.erreurs).slice(0, 3).map(function (e) {
      return { texte: ecrire(e.valeur) + u, juste: false, erreur: e };
    });
    return G.melanger([{ texte: ecrire(q.reponse) + u, juste: true }].concat(faux));
  }
  function juger(q, x) {
    if (N.proche(x, q.reponse, q.tolerance)) return { juste: true };
    var tol = Math.max(q.tolerance, 0.01);
    for (var i = 0; i < q.erreurs.length; i++) if (N.proche(x, q.erreurs[i].valeur, tol)) return { juste: false, erreur: q.erreurs[i] };
    var l = Math.log10(Math.abs(x / q.reponse)), k = Math.round(l);
    if (x * q.reponse > 0 && k !== 0 && Math.abs(l - k) < 0.01) return { juste: false, erreur: G.DECALAGE };
    return { juste: false, erreur: null };
  }
  function poserQuestion(zone, q, mode, fin) {
    vider(zone);
    var fait = false;
    var carte = h("div", { classe: "question" });
    var retour = h("div", { classe: "retour", "aria-live": "polite" });
    function conclure(res) {
      if (fait) return;
      fait = true; clavier = null;
      carte.classList.add(res.juste ? "est-juste" : "est-faux");
      fin(res, retour);
    }
    if (q.contexte) carte.appendChild(h("p", { classe: "contexte", html: q.contexte }));
    carte.appendChild(h("p", { classe: "enonce", html: q.enonce }));
    if (q.type !== "choix" && q.unite) carte.appendChild(h("p", { classe: "demande", html: "Réponse en <b>" + q.unite + "</b>" }));

    if (q.type === "choix" || mode !== "libre") {
      var props = propositions(q);
      var bonne = props.filter(function (p) { return p.juste; })[0];
      /* longues : une colonne partout ; moyennes : une colonne sur telephone seulement */
      var plusLongue = Math.max.apply(null, props.map(function (p) { return p.texte.replace(/<[^>]+>/g, "").length; }));
      var grille = h("div", { classe: "reponses" + (q.type === "choix" || plusLongue > 24 ? " longues" : plusLongue > 11 ? " moyennes" : "") });
      props.forEach(function (p, i) {
        var b = h("button", { type: "button", classe: "reponse" }, [
          h("span", { classe: "touche", "aria-hidden": "true", texte: String(i + 1) }),
          h("span", { classe: "texte", html: p.texte })
        ]);
        b.addEventListener("click", function () {
          if (fait) return;
          b.classList.add(p.juste ? "juste" : "faux");
          [].forEach.call(grille.children, function (x, k) {
            x.disabled = true;
            if (!p.juste && props[k].juste) x.classList.add("attendue");
          });
          conclure({ juste: p.juste, erreur: p.erreur || null, attendue: bonne.texte });
        });
        grille.appendChild(b);
      });
      carte.appendChild(grille);
      clavier = function (ev) {
        var k = parseInt(ev.key, 10);
        if (k >= 1 && k <= props.length) { ev.preventDefault(); grille.children[k - 1].click(); }
      };
    } else {
      var champ = h("input", { type: "text", inputmode: "decimal", autocomplete: "off", spellcheck: "false",
        classe: "champ mono", "aria-label": "Votre réponse, en " + q.unite });
      var aide = h("p", { classe: "aide", texte: "Virgule ou point. 2,5 × 10³ s'écrit aussi 2,5e3 ou 2,5×10^3." });
      var valider = h("button", { type: "submit", classe: "bouton principal" }, "Valider");
      var puissance = h("button", { type: "button", classe: "bouton", title: "Écriture scientifique" }, "× 10ⁿ");
      puissance.addEventListener("click", function () {
        champ.value = champ.value.replace(/\s+$/, "") + "×10^"; champ.focus();
      });
      var form = h("form", { classe: "saisie", novalidate: true }, [
        h("div", { classe: "ligne-saisie" }, [champ, h("span", { classe: "unite mono", html: q.unite })]),
        h("div", { classe: "rangee" }, [valider, puissance]),
        aide
      ]);
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        if (fait) return;
        var x = N.lire(champ.value);
        if (isNaN(x)) {
          aide.textContent = "Ce n'est pas un nombre que je sais lire : 0,25 — 2 500 — 2,5e3 — 2,5×10^3.";
          aide.classList.add("alerte"); champ.focus(); return;
        }
        champ.disabled = valider.disabled = puissance.disabled = true;
        var res = juger(q, x);
        res.attendue = (q.decimale ? ecrireValeur(q, q.reponse) : N.ecrire(q.reponse, q.tolerance < 1e-3 ? 6 : 4)) + (q.unite ? " " + q.unite : "");
        champ.classList.add(res.juste ? "juste" : "faux");
        conclure(res);

  }
  /* Juste : un mot. Faux : l'erreur nommee, la bonne reponse, l'explication, la methode.
     Montrer la bonne reponse est un choix de l'utilisateur pour ce jeu (6 octobre 2026) :
     les nombres changent a chaque question, elle ne sert pas deux fois. */
  function montrerRetour(zone, q, res, suite, texteJuste) {
    vider(zone);

    if (res.juste) { zone.appendChild(h("p", { classe: "verdict", texte: texteJuste || "Juste." })); return; }
    zone.appendChild(h("p", { classe: "verdict" }, [
      "Pas encore",

    ]));
    if (res.attendue) zone.appendChild(h("p", { classe: "attendue" }, [
      h("span", { classe: "etiquette", texte: "La bonne réponse" }), h("span", { classe: "valeur", html: res.attendue })
    ]));
    if (res.erreur && res.erreur.explication) zone.appendChild(h("p", { html: res.erreur.explication }));
    if (q.methode) zone.appendChild(h("p", { classe: "methode" }, [
      h("span", { classe: "etiquette", texte: "Méthode" }), h("span", { html: q.methode })
    ]));
    var b = h("button", { type: "button", classe: "bouton principal" }, "Continuer");
    b.addEventListener("click", suite);
    zone.appendChild(b);
    setTimeout(function () { b.focus(); }, 40);
  }
  function noterErreur(carnet, erreur, q) {
    var nom = erreur ? erreur.nom : "Erreur non reconnue";
    if (!carnet[nom]) carnet[nom] = { n: 0, explication: erreur ? erreur.explication : "Aucune erreur type ne correspond : reprenez la méthode pas à pas." };
    carnet[nom].n++;

  function listeErreurs(carnet) {
    var noms = Object.keys(carnet).sort(function (a, b) { return carnet[b].n - carnet[a].n; });
    if (!noms.length) return null;
    return h("section", { classe: "rubrique" }, [
      h("h2", { texte: "Ce qui a coincé" }),
      h("ul", { classe: "coince" }, noms.map(function (nom) {
        return h("li", {}, [
          h("span", { classe: "coince-tete" }, [h("b", { texte: nom }), h("span", { classe: "pastille mono", texte: "× " + carnet[nom].n })]),
          h("span", { classe: "detail", html: carnet[nom].explication })
        ]);
      }))
    ]);
  }

  /* ═══════════════════════════════════════════ LE CONTRE-LA-MONTRE */
  var RANGS = [{ points: 0, titre: "Stagiaire" }, { points: 1500, titre: "Apprentissage" },
               { points: 4000, titre: "Confirmé" }, { points: 8000, titre: "Référent" }, { points: 12000, titre: "Expertise" }];
  function rang(c, score) {
    var r = c.rangs || RANGS, i = 0;
    while (i + 1 < r.length && score >= r[i + 1].points) i++;
    return { actuel: r[i], suivant: r[i + 1] || null };
  }

  function lancerChrono(c, a) {
    document.title = a.titre + " · " + c.nom;
    var duree = (a.duree || 90) * 1000, bonus = (a.bonus === undefined ? 2 : a.bonus) * 1000;
    var viesMax = a.vies || 3, saisie = a.saisie || "mixte";
    var organes = c.organes || [], parOrgane = c.parOrgane || 3, parNiveau = 5;
    var J = { score: 0, vies: viesMax, serie: 0, meilleure: 0, bonnes: 0, total: 0, niveau: 1,
              erreurs: {}, allumes: 0, interventions: 0 };
    var restant = duree, depuis = 0, enPause = true, fini = false, tic = 0, minuteries = [];

    var elVies = h("span"), elTemps = h("span", { classe: "temps mono" }), elJauge = h("span", { classe: "jauge-remplie" });
    var elScore = h("span", { classe: "points mono", texte: "0" }), elMult = h("span", { classe: "mult mono x1", texte: "×1" });
    var elNiveau = h("span", { classe: "pastille" }), elSerie = h("span", { classe: "pastille" });
    var blocTemps = h("div", { classe: "hud-bloc hud-temps" }, [h("span", { classe: "hud-nom", texte: "Temps" }), elTemps, h("span", { classe: "jauge" }, [elJauge])]);
    var blocScore = h("div", { classe: "hud-bloc hud-score" }, [h("span", { classe: "hud-nom", texte: "Score" }), h("span", { classe: "score-ligne" }, [elMult, elScore])]);
    var elInstall = organes.length ? h("ol", { classe: "installation" }) : null;
    var zone = h("div", { classe: "zone-question" });

    afficher([
      barre({ href: "#/" + c.id, texte: "Arrêter" }, a.calculatrice !== undefined ? a.calculatrice : c.calculatrice),
      h("div", { classe: "titre-jeu" }, [h("h1", { texte: a.titre }), h("div", { classe: "rangee" }, [elNiveau, elSerie])]),
      h("div", { classe: "hud" }, [h("div", { classe: "hud-bloc" }, [h("span", { classe: "hud-nom", texte: "Cœurs" }), elVies]), blocTemps, blocScore]),
      elInstall ? h("div", { classe: "bloc-installation" }, [h("p", { classe: "hud-nom", texte: c.installation || "L'installation" }), elInstall]) : null,
      zone
    ]);

    function plus(fn, ms) { minuteries.push(setTimeout(fn, ms)); }
    function multiplicateur() { return Math.min(4, 1 + Math.floor(J.serie / 3)); }
    function dessinerVies(casse) { vider(elVies); elVies.appendChild(coeurs(J.vies, viesMax, casse)); }
    function dessinerInstall() {
      if (!elInstall) return;
      vider(elInstall);
      organes.forEach(function (o, i) {
        elInstall.appendChild(h("li", { classe: i < J.allumes ? "en-service" : "" }, [h("span", { classe: "noeud" }), h("span", { classe: "organe", texte: o })]));
      });
    }
    function dessinerCompteurs() {
      elScore.textContent = N.ecrire(J.score, 9);
      var m = multiplicateur();
      if (elMult.textContent !== "×" + m) { elMult.textContent = "×" + m; elMult.classList.toggle("x1", m === 1); relancer(elMult, "pulse"); }
      elNiveau.textContent = "Niveau " + J.niveau;
      elSerie.textContent = "Série " + J.serie;
    }
    function lireRestant() { return enPause ? restant : restant - (performance.now() - depuis); }
    function suspendre() { if (enPause) return; restant = lireRestant(); enPause = true; }
    function reprendre() { if (!enPause || fini) return; depuis = performance.now(); enPause = false; }
    /* Le temps se lit sur l'horloge, pas au nombre de battements : un onglet en
       arriere-plan ralentit les minuteries, la partie n'en dure pas plus. */
    function battre() {
      var r = Math.max(0, lireRestant()), s = Math.ceil(r / 1000);

      elJauge.style.transform = "scaleX(" + (r / duree).toFixed(4) + ")";

    function flotter(texte) {

      blocScore.appendChild(f);
      plus(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 950);
    }

    function poser() {
      var q = G.produire(G.un(a.generateurs), J.niveau);
      var mode = saisie === "mixte" ? (J.niveau >= 3 ? "libre" : "choix") : saisie;
      poserQuestion(zone, q, mode, function (res, zoneRetour) {
        suspendre();
        J.total++;
        if (res.juste) {
          J.serie++; J.bonnes++; J.meilleure = Math.max(J.meilleure, J.serie);
          var gain = 100 * J.niveau * multiplicateur();
          J.score += gain;
          restant = Math.min(duree, restant + bonus);
          Son.juste(); flotter("+" + gain);
          montrerRetour(zoneRetour, q, res, null, "Juste. +" + gain);
          var avant = J.niveau;
          J.niveau = Math.min(3, 1 + Math.floor(J.bonnes / parNiveau));
          if (J.niveau > avant) {
            Son.niveau();
            annoncer(J.niveau === 3 && saisie === "mixte" ? "Niveau 3 · à vous d'écrire la réponse" : "Niveau " + J.niveau);
          }
          if (organes.length && J.bonnes % parOrgane === 0) {

          h("h1", { texte: rg.actuel.titre }),
          h("p", { classe: "score-final" }, [h("span", { classe: "mono", texte: N.ecrire(J.score, 9) }), h("span", { classe: "unite-score", texte: " points" })]),
          h("p", { classe: nouveau ? "record" : "detail", texte: nouveau ? "Nouveau record sur cet appareil."
            : ancien ? "Record : " + N.ecrire(ancien.score, 9) + " points." : "Pas encore de record : une bonne réponse suffit." }),
          rg.suivant ? h("p", { classe: "detail", texte: "Prochain cap : " + rg.suivant.titre + ", à " + N.ecrire(rg.suivant.points, 9) + " points." }) : null,
          h("div", { classe: "stats" }, stats.map(function (s) {
            return h("div", { classe: "stat" }, [h("span", { classe: "hud-nom", texte: s[0] }), h("span", { classe: "val mono", texte: s[1] })]);
          })),

        ])

  /* ═══════════════════════════════════════════ LE PARCOURS D'UNE LECON */
  function developper(liste) {
    var sortie = [];
    liste.forEach(function (q) {
      if (q.generateur && G.estSuite(q.generateur.nom)) {
        G.produireSuite(q.generateur).forEach(function (g) { g.saisie = q.saisie || "libre"; sortie.push(g); });
      } else if (q.generateur) {
        for (var r = 0; r < (q.repeter || 1); r++) {
          var g = G.produire(q.generateur, q.niveau || 1);
          g.saisie = q.saisie || "choix";
          sortie.push(g);
        }
      } else if (q.type === "nombre") {
        var copie = {};
        for (var k in q) copie[k] = q[k];
        copie.tolerance = q.tolerance || 0.01;
        copie.erreurs = G.ranger(q.reponse, q.erreurs || []);
        copie.saisie = q.saisie || "libre";
        sortie.push(copie);
      } else sortie.push(q);
    });
    return sortie;
  }
  function compter(e) {
    return e.questions.reduce(function (s, q) {
      if (q.generateur && G.estSuite(q.generateur.nom)) return s + G.produireSuite(q.generateur).length;
      return s + (q.generateur ? (q.repeter || 1) : 1);
    }, 0);
  }
  function etoilesDe(c, l) { return etat.parcours[c.id + "/" + l.id] || []; }

  function pageLecon(c, l) {
    document.title = l.titre + " · " + c.nom;
    var st = etoilesDe(c, l);

      })),

  function controle() {

  function demarrerChrono(c, a) { if (arretEnCours) arretEnCours(); arretEnCours = null; lancerChrono(c, a); }

<script>/* contenu/bts-fed-c-hydraulique.js */
/* Entrainement · BTS FED option C · hydraulique et ECS, seances 7 a 10.
   La lecon J7 est dans bts-fed-c.js ; celles-ci la suivent.
   Les questions de cours viennent des pages J7-WEB a J10-WEB et SEQ2-WEB.
   Meme ecriture que la thermique : qc(enonce, juste, [[faux, erreur, explication]], regle). */
(function () {
  function qc(enonce, juste, faux, methode) {
    return {
      type: "choix", enonce: enonce, methode: methode,
      choix: [{ texte: juste, juste: true }].concat(faux.map(function (f) {
        return { texte: f[0], erreur: f[1], explication: f[2] };
      }))
    };
  }
  var THEME = "Hydraulique et ECS · séances 7 à 10";

  /* ═══════════════════════════════════════════ J7 · les reseaux */
  var J7 = [
    qc("En bitube, chaque émetteur reçoit une eau :", "à la même température",
      [["de plus en plus froide", "Bitube confondu avec monotube", "C'est en monotube que l'eau se refroidit d'émetteur en émetteur."]],
      "Bitube : un aller et un retour par émetteur, même température de départ."),
    qc("Dans un monotube, le dernier radiateur, pour la même puissance, doit être :", "plus grand",
      [["plus petit", "Sens inversé", "Il reçoit une eau plus froide : il lui faut plus de surface."]],
      "Monotube : l'eau se refroidit en chemin, les derniers émetteurs grossissent."),
    qc("En retour direct, l'émetteur le mieux alimenté est :", "le premier, le plus proche",
      [["le dernier", "Chemin le plus court oublié", "L'eau prend le chemin qui lui résiste le moins."]],
      "Deux branches en parallèle : la plus courte prend plus que sa part."),
    qc("Le retour inversé sert à :", "égaliser les longueurs de circuit",
      [["économiser du tube", "Avantage inversé", "Il demande un peu plus de tube, et il équilibre sans réglage."]],
      "Retour inversé : chaque circuit parcourt la même longueur totale."),
    qc("Pour corriger un réseau où les premiers émetteurs prennent trop de débit, on peut :", "ajouter de la résistance aux branches favorisées",
      [["augmenter la vitesse du circulateur", "Le remède aggrave", "Plus de pression, et les branches favorisées en prennent encore plus."]],
      "Équilibrer, c'est dégrader volontairement les branches favorisées.")
  ];

  /* ═══════════════════════════════════════════ J8 · les pertes de charge */
  var J8 = [
    qc("La perte linéique s'exprime en :", "Pa/m",
      [["Pa", "Linéique et totale confondues", "Linéique : par mètre de tube. Le total, en Pa, vient de j × (L + Léq)."]],
      "j en Pa/m ; Δp = j × (L + Léq) en Pa."),
    qc("Une longueur équivalente, c'est :", "la longueur de tube droit qui coûterait autant",
      [["la longueur réelle de la singularité", "Encombrement pris pour la perte", "Un robinet de quelques centimètres peut valoir plusieurs mètres de tube."]],
      "Léq : la singularité convertie en mètres de tube droit."),
    qc("Pour la perte de charge d'un tronçon, on :", "additionne L et toutes les Léq, puis multiplie une fois par j",
      [["calcule j × L : les singularités sont négligeables", "Singularités oubliées", "Elles font couramment la moitié à deux tiers de la longueur totale."]],
      "Δp = j × (L + Léq)."),
    qc("Sur l'abaque à axes logarithmiques, la distance de 1 à 10 vaut :", "celle de 10 à 100",
      [["dix fois moins", "Échelle lue comme linéaire", "Chaque décade a la même longueur."]],
      "Axes log : entre 1 et 10, neuf intervalles inégaux."),
    qc("À débit égal, passer au diamètre supérieur fait que la vitesse :", "diminue, et la perte linéique s'effondre",
      [["augmente", "Sens inversé", "Section plus grande, eau plus lente."],
       ["ne change pas", "Débit et vitesse confondus", "Le débit reste ; la vitesse dépend de la section."]],
      "v = Q / (0,36 × S) : plus de section, moins de vitesse."),
    qc("Un tronçon se valide sur :", "la vitesse, sous 1 m/s, et la perte linéique, sous 200 Pa/m",
      [["la vitesse seule", "Critère unique", "Un tube peut tenir la vitesse et dépasser 200 Pa/m."]],
      "Deux critères, jamais un seul."),
    qc("Le circulateur, dans le calcul des singularités :", "ne compte pas",
      [["compte comme un coude", "Pompe comptée comme obstacle", "Il fournit la pression ; il n'entre pas dans les pertes du réseau."]],
      "On compte ce qui freine l'eau, pas ce qui la pousse."),
    qc("Le robinet thermostatique, en longueur équivalente, pèse :", "plus qu'un coude",
      [["moins qu'un coude", "Singularité sous-estimée", "Les robinets pèsent souvent plus que tout le tube droit du circuit."]],
      "Les robinets et vannes sont les singularités lourdes."),
    qc("Dans le bilan de charge de la séance, le tube et ses coudes représentent :", "moins d'un tiers du total",
      [["presque tout", "Organes oubliés", "Générateur, émetteurs et vannes font 71 % : leurs pertes se lisent chez le constructeur."]],
      "Un bilan de charge additionne le tube et les organes."),
    qc("1 mCE vaut environ :", "9 810 Pa, soit près de 10 kPa",
      [["1 000 Pa", "mCE sous-estimé", "Un mètre d'eau, c'est 9 810 Pa."],
       ["1 bar", "mCE et bar confondus", "1 bar ≈ 10 mCE."]],
      "1 mCE = 9 810 Pa ≈ 10 kPa ; 1 bar ≈ 10 mCE."),
    qc("Le seuil de 200 Pa/m est :", "un compromis économique",
      [["une limite physique", "Repère pris pour une loi", "En dessous : gros tubes coûteux ; au-dessus : circulateur gourmand et bruyant."]],
      "200 Pa/m : l'équilibre entre le prix du cuivre et celui du pompage."),
    qc("Le tronçon le plus défavorisé :", "fixe la hauteur du circulateur ; on équilibre les autres",
      [["est celui qui a le plus de débit", "Débit pris pour la perte", "C'est la branche à la plus forte perte de charge, souvent la plus éloignée."]],
      "La pompe se dimensionne sur le tronçon le plus défavorisé.")
  ];

  /* ═══════════════════════════════════════════ J9 · le point de fonctionnement */
  var J9 = [
    qc("La perte de charge d'un réseau varie comme :", "le carré du débit",
      [["le débit", "Réseau pris pour une résistance électrique", "Plus l'eau va vite, plus elle frotte : Δp = k × Q²."]],
      "Δp = k × Q²."),
    qc("Doubler le débit multiplie la perte de charge par :", "4",
      [["2", "Proportionnalité supposée", "(2Q)² = 4 Q²."]],
      "Δp₂ = Δp₁ × (Q₂ / Q₁)²."),
    qc("À débit nul, la perte de charge du réseau vaut :", "zéro",
      [["la hauteur maximale de la pompe", "Courbes confondues", "C'est la pompe qui a une hauteur à débit nul ; un réseau à l'arrêt n'oppose rien."]],
      "La courbe du réseau est une parabole qui part de zéro."),
    qc("La caractéristique d'un circulateur, quand le débit augmente :", "descend",
      [["monte", "Courbe de pompe et de réseau confondues", "Plus on lui demande de débit, moins la pompe pousse fort."]],
      "La pompe descend, le réseau monte : un seul croisement."),
    qc("Le point de fonctionnement est :", "imposé par le croisement des deux courbes",

  var TOUTES = J7.concat(J8, J9, J10);
